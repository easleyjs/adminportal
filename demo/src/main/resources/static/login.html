<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal · Sign in</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="card">
    <h1>Admin sign in</h1>
    <p class="sub">Enter your credentials to access the control panel.</p>

    <div class="error" id="errorMsg">Incorrect username or password.</div>

    <form id="loginForm" autocomplete="on">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="e.g. jsmith" autocomplete="username" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div class="row-between">
            <label class="remember">
                <input type="checkbox" id="remember" name="remember">
                Keep me signed in
            </label>
        </div>

        <button type="submit">Sign in</button>
    </form>

    <div class="forgot-wrap">
        <a href="#">Forgot username / password?</a>
    </div>
</div>

<script>
    // Placeholder submit handler — wire this up to your auth endpoint.
    document.getElementById('loginForm').addEventListener('submit', function(e){
        e.preventDefault();
        // Example: show an error state on failed login
        // document.getElementById('errorMsg').style.display = 'block';
        console.log('Login submitted', {
            username: document.getElementById('username').value,
            remember: document.getElementById('remember').checked
        });
    });
</script>

</body>
</html>
