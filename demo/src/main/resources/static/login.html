<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal · Sign in</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="card">
    <h1>Admin sign in</h1>
    <p class="sub">Enter your credentials to access the control panel.</p>

    <div class="error" id="errorMsg">Incorrect username or password.</div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. jsmith" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember">
          Keep me signed in
        </label>
      </div>

      <button type="submit">Sign in</button>
    </form>

    <div class="forgot-wrap">
      <a href="#">Forgot username / password?</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const errorMsg = document.getElementById('errorMsg');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    function showLoginError(message){
      errorMsg.textContent = message || 'Incorrect username or password.';
      errorMsg.classList.add('visible', 'shake');
      // restart the shake animation if it's already showing
      errorMsg.addEventListener('animationend', () => {
        errorMsg.classList.remove('shake');
      }, { once: true });
    }

    function hideLoginError(){
      errorMsg.classList.remove('visible');
    }

    // Hide the error as soon as the person starts correcting their input
    usernameInput.addEventListener('input', hideLoginError);
    passwordInput.addEventListener('input', hideLoginError);

    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();

      try {
        await App.auth.login(usernameInput.value, passwordInput.value);
        window.location.href = 'members.html';
      } catch (err) {
        showLoginError(err.message);
      }
    });
  </script>

</body>
</html>
