<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal · Door</title>
<link rel="stylesheet" href="css/members.css">
</head>
<body class="door-mode">

  <header class="header">
    <div class="header-top">
      <h1>Door<span class="count" id="count"></span></h1>
      <div class="user-menu">
        <button class="user-avatar" id="userMenuBtn" aria-haspopup="true" aria-expanded="false">JD</button>
        <div class="user-dropdown" id="userDropdown">
          <button class="user-dropdown-item" id="profileBtn">Profile</button>
          <button class="user-dropdown-item" id="switchModeBtn">Switch to Admin</button>
          <button class="user-dropdown-item is-danger" id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
    <button class="scan-btn visible" id="scanBtn" type="button">SCAN</button>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search" placeholder="Search members...">
      <button class="clear-search" id="clearSearch" aria-label="Clear search" type="button">✕</button>
    </div>
  </header>

  <nav class="chips door-mode" id="chips">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="admin">Admin</button>
    <button class="chip" data-filter="staff">Staff</button>
    <button class="chip" data-filter="active">Active</button>
    <button class="chip" data-filter="inactive">Inactive</button>
  </nav>

  <main>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" style="display:none;">No members match this filter.</div>

    <div class="pagination" id="pagination">
      <div class="per-page">
        <label for="perPage">Results per page</label>
        <select id="perPage">
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </div>
      <div class="page-nav">
        <button id="prevPage" aria-label="Previous page">‹</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button id="nextPage" aria-label="Next page">›</button>
      </div>
    </div>
  </main>

  <button class="fab" id="addBtn" title="Add member" aria-label="Add member">+</button>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/door.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/members.js"></script>

</body>
</html>
