<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal · Admin</title>
<link rel="stylesheet" href="css/members.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <h1>Admin<span class="count" id="count"></span></h1>
      <div class="user-menu">
        <button class="user-avatar" id="userMenuBtn" aria-haspopup="true" aria-expanded="false">JD</button>
        <div class="user-dropdown" id="userDropdown">
          <button class="user-dropdown-item" id="profileBtn">Profile</button>
          <button class="user-dropdown-item" id="switchModeBtn">Switch to Door</button>
          <button class="user-dropdown-item is-danger" id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
    <button class="scan-btn" id="scanBtn" type="button">SCAN</button>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search" placeholder="Search members...">
      <button class="clear-search" id="clearSearch" aria-label="Clear search" type="button">✕</button>
    </div>
  </header>

  <nav class="chips" id="chips">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="admin">Admin</button>
    <button class="chip" data-filter="staff">Staff</button>
    <button class="chip" data-filter="active">Active</button>
    <button class="chip" data-filter="inactive">Inactive</button>
  </nav>

  <main>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" style="display:none;">No members match this filter.</div>

    <div class="pagination" id="pagination">
      <div class="per-page">
        <label for="perPage">Results per page</label>
        <select id="perPage">
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </div>
      <div class="page-nav">
        <button id="prevPage" aria-label="Previous page">‹</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button id="nextPage" aria-label="Next page">›</button>
      </div>
    </div>
  </main>

  <button class="fab" id="addBtn" title="Add member" aria-label="Add member">+</button>

  <div class="modal-overlay" id="memberModalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <button class="modal-close" id="modalCloseBtn" aria-label="Close">✕</button>

      <div class="modal-avatar" id="modalAvatar"></div>
      <h2 class="modal-name" id="modalName"></h2>
      <div class="modal-member-number" id="modalMemberNumber"></div>

      <div class="modal-meta">
        <div class="modal-row">
          <span class="modal-label">Status</span>
          <span class="badge badge-status" id="modalStatus"><span class="dot"></span><span id="modalStatusText"></span></span>
        </div>
        <div class="modal-row">
          <span class="modal-label">Email</span>
          <span id="modalEmail"></span>
        </div>
      </div>

      <div class="modal-actions" id="modalActions">
        <button class="modal-btn modal-btn-checkin" id="modalCheckInBtn">Check In</button>
        <button class="modal-btn" id="modalEditBtn">Edit</button>
        <button class="modal-btn modal-btn-danger" id="modalSuspendBtn">Suspend</button>
        <button class="modal-btn modal-btn-accent" id="modalReissueBtn">Reissue QR</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/door.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/members.js"></script>

</body>
</html>
